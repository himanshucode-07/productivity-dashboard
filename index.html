<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="reset.css" />
    <link rel="stylesheet" href="variables.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>FocusFlow</title>
  </head>
  <body>
    <!-- Study Hours  -->
    <div id="challenge">
      <div class="sidebar">
        <h1>FocusFlow</h1>
        <nav>
          <a href="#Task-List">Tasks</a>
          <a href="#Study-Hours">Study</a>
          <a href="#Water-intake">Intake</a>
          <a href="#Timer">Timer</a>
        </nav>

        <div class="streak">7 day Streak</div>
      </div>

      <div class="main">
        <!-- Task-List -->
        <div class="greeting">
          <h2></h2>
          <p>0 of 0 tasks done</p>
        </div>
        <div class="Task-List">
          <h2>Tasks</h2>
          <div class="task-input-raw">
            <input type="text" id="taskInput" placeholder="Add a task" />
            <button id="addTask">Add Task</button>
          </div>
          <ul id="tasklist"></ul>
        </div>
      </div>

      <div class="right-panel">
        <div class="Study-Hours">
          <p class="widget-label">STUDY HOURS</p>

          <!-- Block grid -->
          <div class="study-blocks" id="studyBlocks"></div>

          <!-- Time display -->
          <div class="study-time-display">
            <span class="study-hours-count">0h 0m</span>
            <span class="study-goal">goal <span id="studyGoal">6</span>h</span>
          </div>

          <!-- Input + Save -->
          <div class="study-input-row">
            <input
              type="number"
              id="Study-Hours"
              placeholder="Set goal"
              min="1"
              max="24"
            />
            <button id="Save">Save</button>
          </div>

          <!-- Control buttons -->
          <div class="study-controls">
            <button class="Study-Started">Study</button>
            <button class="breakTime">Break</button>
            <button class="reset-session">Reset</button>
          </div>
        </div>
        <!--Water-Intake  -->
        <div class="Water-intake">
          <p class="widget-label">WATER INTAKE</p>

          <div class="water-arc-container">
            <svg width="120" height="120" viewBox="0 0 120 120">
              <!-- Track circle -->
              <circle
                cx="60"
                cy="60"
                r="45"
                fill="none"
                stroke="#E2E1DC"
                stroke-width="8"
              />
              <!-- Progress circle -->
              <circle
                class="water-progress"
                cx="60"
                cy="60"
                r="45"
                fill="none"
                stroke="#3B82F6"
                stroke-width="8"
                stroke-linecap="round"
                stroke-dasharray="282.7"
                stroke-dashoffset="282.7"
                transform="rotate(-90 60 60)"
              />
            </svg>
            <!-- Count center mein -->
            <div class="water-count">
              <span class="count">0</span>
              <span class="water-total">of 8</span>
            </div>
          </div>

          <p class="water-glasses">glasses</p>

          <!-- Buttons -->
          <div class="water-buttons">
            <button class="btn minus-btn">−</button>
            <button class="btn plus-btn">+</button>
            <button class="resetBtn">reset</button>
          </div>
        </div>

        <!-- Timer -->
        <div class="Timer">
          <p class="widget-label">FOCUS TIMER</p>

          <div class="timer-arc-container">
            <svg width="120" height="120" viewBox="0 0 120 120">
              <!-- Track circle -->
              <circle
                cx="60"
                cy="60"
                r="45"
                fill="none"
                stroke="#E2E1DC"
                stroke-width="8"
              />
              <!-- Progress circle -->
              <circle
                class="timer-progress"
                cx="60"
                cy="60"
                r="45"
                fill="none"
                stroke="var(--purple)"
                stroke-width="8"
                stroke-linecap="round"
                stroke-dasharray="282.7"
                stroke-dashoffset="0"
                transform="rotate(-90 60 60)"
              />
            </svg>

            <!-- Time center mein -->
            <div class="timer-count">
              <span id="timerDisplay">25:00</span>
            </div>
          </div>

          <p class="timer-session-label">Deep Work · Session 1</p>

          <!-- Input -->
          <div class="timer-input-row">
            <input
              type="number"
              id="timerInput"
              placeholder="Minutes"
              min="1"
              max="60"
              value="25"
            />
          </div>

          <!-- Buttons -->
          <div class="timer-controls">
            <button id="startTimer">Start</button>
            <button id="stopTimer">Pause</button>
            <button class="task-complete">Complete</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="script.js"></script>
  </body>
</html>
